; TK-Talkie V5 for ESP32
;
; The V5 sources in this folder are built as-is. Everything ESP32-specific
; lives in esp32/:
;   esp32/lib/SD, Snooze, SerialFlash  stand-ins for the Teensy libraries
;   esp32/lib/TKPort                   port layer, force-included into V5
;   esp32/tktalkie5_ino.cpp            builds the sketch as plain C++
;
; Build:  pio run -e audiokit
; The teensy40 environment builds the same sources for the original target,
; to check that edits to V5 still compile there.

[platformio]
src_dir = .
default_envs = audiokit

[env]
framework = arduino

; Shared by all ESP32 boards
[esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
upload_speed = 921600

; The top-level V5 .cpp files, plus the sketch through esp32/tktalkie5_ino.cpp.
; PlatformIO still writes a temporary tktalkie5.ino.cpp when its converter
; works; leave it out so the sketch isn't compiled twice.
build_src_filter = -<*> +<*.cpp> -<*.ino.cpp> +<esp32/tktalkie5_ino.cpp>

; The stand-ins here take priority over the framework's own SD library.
; (Not lib_dir, which every environment would use, Teensy included.)
lib_extra_dirs = esp32/lib

lib_deps =
    AudioLibrary=https://github.com/FrankBoesing/ESP-beatsy-Audio-Library.git#5b7cdbe362132a4e76f478335d480b0e70bec216
    thomasfredericks/Bounce2 @ 2.72
    bblanchon/ArduinoJson @ 6.21.6
    h2zero/NimBLE-Arduino @ 2.5.2
    TKPort

build_src_flags =
    -include tk_port.h

; ESP32-A1S Audio Kit V2.2 (ES8388)
[env:audiokit]
extends = esp32
board = esp32dev
board_build.partitions = huge_app.csv
build_flags =
    -D TK_BOARD_AUDIOKIT
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Original target: Teensy 4.0 + Audio Shield, with Teensyduino's own Audio,
; SD, SerialFlash and Snooze libraries. Teensyduino's bundled Bounce2 (2.55)
; predates the Bounce2::Button class V5 uses, hence the newer one here.
[env:teensy40]
platform = platformio/teensy @ 6.0.0
board = teensy40
build_src_filter = -<*> +<*.ino> +<*.cpp>
lib_deps =
    thomasfredericks/Bounce2 @ 2.72
    bblanchon/ArduinoJson @ 6.21.6
